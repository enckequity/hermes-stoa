name: stoa
version: 0.26.0
manifest_version: 2
api_version: 1
description: >-
  The CRM for Hermes Agent, a lightweight one you talk to: map a market, find the leads, run the
  pipeline and see it through to cash. Hermes runs it and you approve: what it finds waits for
  your yes or no, every change is on a ledger and can be taken back. A page and a live pane in the
  Desktop app and Webapp, Slack cards with buttons, and playbooks that fit it to any business.
author: jarrett-del
license: MIT
homepage: https://github.com/jarrett-del/hermes-stoa
requires_hermes: ">=0.23.0"
tags: [gtm, sales, crm, recruiting, slack, pipeline]

provides_tools:
  - gtm_pipeline
  - gtm_deal
  - gtm_card
  - gtm_market
  - gtm_enrich
  - gtm_notes
  - gtm_playbook
  - gtm_export
  - gtm_report
  - gtm_intake
  - gtm_contact
  - gtm_invoice
  - gtm_group

# Counts only: how many model calls and tokens a turn that worked on a market map used, so the map can show what it cost.
# No prompt, reply or tool result is read or kept.
provides_hooks:
  - post_api_request
  - post_llm_call

config_schema:
  playbook:
    type: str
    default: b2b-sales
    label: Playbook
    description: "Which playbook the desk runs on: b2b-sales, recruiting, agency, client-leads, partnerships, or one you saved."
  channels:
    type: list
    default: []
    label: Limit to these chats
    description: "Chat ids (for example Slack channel ids) where the desk is available. Empty means everywhere. Terminal and Desktop sessions are always allowed; add the word cron to let scheduled jobs use it too."
  slack_users:
    type: list
    default: []
    label: Who may press Slack buttons
    description: "Slack user ids (they start with U) who may press the buttons on any card, review or map. Empty means only the person a card was posted for can press its buttons."
  import_dir:
    type: str
    default: ""
    label: Import folder
    description: "A folder the agent may read CSV files from by path, besides the plugin's own imports folder and the working directory. Optional."
  notes_dir:
    type: str
    default: ""
    label: Meeting notes folder
    description: "The folder your call notes are saved in: an Obsidian folder, or wherever a recorder such as Plaud exports to. Several folders, with a semicolon between them. Reads Markdown, text, Word and subtitle files, three folders deep. Optional; easier to set on the Stoa page, under Setup."
  notes_connections:
    type: str
    default: ""
    label: Note connections
    description: "Optional. The names of connectors Hermes already has that hold call notes (for example: plaud), with commas between. Hermes then looks there on a notes sweep, with that connector's own tools."
  notes_days:
    type: int
    default: 7
    label: Notes look-back (days)
    description: "How far back the notes inbox looks."
  files_keep_days:
    type: int
    default: 7
    label: Keep dropped files for (days)
    description: "A file dropped in the Stoa talk box is copied by Hermes into its own attachments folder. Stoa removes that copy after this many days. 0 keeps it until you remove it under Setup."
  pdl_monthly_cap:
    type: int
    default: 50
    label: Enrichment cap per month
    description: "Most People Data Labs lookups the desk will pay for in a calendar month. 0 means no cap."
  pdl_api_key:
    type: secret
    env: PDL_API_KEY
    label: People Data Labs API key
    description: "Optional. Turns on the Enrich button, gtm_enrich and buyer lookups on a map. Copy yours from dashboard.peopledatalabs.com."
  exa_api_key:
    type: secret
    env: EXA_API_KEY
    label: Exa API key
    description: "Optional. Lets the market map search for companies directly; without it the agent uses its own web search. Make one at dashboard.exa.ai/api-keys."
  granola_api_key:
    type: secret
    env: GRANOLA_API_KEY
    label: Granola API key
    description: "Optional. Adds your Granola call notes to the notes inbox. Made in the Granola app: Settings, Connectors, API keys."
  fireflies_api_key:
    type: secret
    env: FIREFLIES_API_KEY
    label: Fireflies API key
    description: "Optional. Adds your Fireflies meetings to the notes inbox (summaries and action items, never the transcript). In Fireflies: Integrations, Fireflies API."
